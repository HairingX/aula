name: Release

# Run this from the Actions tab, on main, once the maintainer has approved the draft release and
# its version. Never publish the draft release by hand: HACS installs the zip a release carries,
# which only this workflow builds.
#
# Everything runs in one direction, and nothing leaves the runner until it has been checked:
# work out the version -> test and validate the exact commit -> build the zip with the manifest's
# version set, and check it -> tag that commit -> GitHub release with the zip. Nothing is pushed to
# main: the repository's manifest says 0.0.0, and the version lives in the tag and the zip.
# If publishing fails part-way, "Re-run failed jobs" resumes it; "Re-run all jobs" is refused,
# as the version is then already tagged.
on:
  workflow_dispatch:
    inputs:
      release:
        description: >-
          What to release. The version is worked out from the tags and the draft release: the
          next release candidate, or the final release that ends the series.
        required: true
        type: choice
        options:
          - release candidate
          - final release
        default: release candidate
      version:
        description: >-
          Override, only for a new major version, which is never worked out, or when the version
          worked out is wrong: canonical PEP 440 without a v, such as 1.0.0 or 1.0.0rc1, of the
          kind chosen above. It must still be higher than every version released.
        required: false
        type: string

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

env:
  INTEGRATION: custom_components/aula

# The shell given explicitly, so GitHub runs every step with pipefail.
defaults:
  run:
    shell: bash

jobs:
  prepare:
    name: Work out the version
    runs-on: ubuntu-latest
    permissions:
      # Draft releases are listed only to those who can push.
      contents: write
      # The pull requests merged since the previous release.
      pull-requests: read
      # Whether Release Drafter has finished with the commit released.
      actions: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      prerelease: ${{ steps.version.outputs.prerelease }}
      previous_tag: ${{ steps.version.outputs.previous_tag }}
      sha: ${{ steps.main.outputs.sha }}
      draft_id: ${{ steps.draft.outputs.draft_id }}
      draft_body: ${{ steps.draft.outputs.draft_body }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Refuse to run from anything but main
        if: github.ref != 'refs/heads/main'
        run: |
          # The tests and this workflow are taken from the branch it runs from.
          echo "::error::Run the release from main, not $GITHUB_REF_NAME."
          exit 1

      - name: Check out main
        uses: actions/checkout@v7
        with:
          ref: main
          persist-credentials: false

      - name: Record the commit to release
        id: main
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install packaging
        run: python -m pip install packaging==26.3

      # Read before the draft: the draft describes the commit only if Release Drafter had already
      # finished with it when the draft was read.
      - name: Check that Release Drafter has finished with the commit
        id: drafter
        env:
          SHA: ${{ steps.main.outputs.sha }}
        run: |
          run=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow release-drafter.yml \
            --branch main --event push --limit 1 --json headSha,status,conclusion \
            --jq '.[0] | "\(.headSha) \(.status) \(.conclusion)"')
          echo "Newest Release Drafter run on main: ${run:-none}"
          if [[ "$run" == "$SHA completed success" ]]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Read the draft release
        id: draft
        run: |
          gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            --jq '.[] | select(.draft) | @json' > "$RUNNER_TEMP/drafts"
          python .github/scripts/release_version.py draft "$RUNNER_TEMP/drafts" >> "$GITHUB_OUTPUT"
          grep '^draft_tag=' "$GITHUB_OUTPUT"

      - name: Work out the version
        id: version
        env:
          RELEASE: ${{ inputs.release }}
          OVERRIDE: ${{ inputs.version }}
          DRAFT_TAG: ${{ steps.draft.outputs.draft_tag }}
        run: |
          gh api --paginate "repos/$GITHUB_REPOSITORY/tags?per_page=100" --jq '.[].name' \
            > "$RUNNER_TEMP/tags"
          python .github/scripts/release_version.py next "$RELEASE" "$DRAFT_TAG" "$OVERRIDE" \
            "$RUNNER_TEMP/tags" | tee -a "$GITHUB_OUTPUT"

      - name: Refuse a draft that does not describe the commit
        if: steps.version.outputs.uses_draft == 'true'
        env:
          SHA: ${{ steps.main.outputs.sha }}
          READY: ${{ steps.drafter.outputs.ready }}
        run: |
          main=$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)
          if [[ "$READY" != "true" || "$main" != "$SHA" ]]; then
            echo "::error::The draft release is not yet up to date with main. Wait for the Release Drafter run on main to finish, then run the release again."
            exit 1
          fi

      - name: Refuse a release without changes
        if: steps.version.outputs.previous_tag != ''
        env:
          SINCE: ${{ steps.version.outputs.previous_tag }}
          SHA: ${{ steps.main.outputs.sha }}
        run: |
          gh api --paginate "repos/$GITHUB_REPOSITORY/compare/$SINCE...$SHA" \
            --jq '.commits[].sha' > "$RUNNER_TEMP/commits"
          : > "$RUNNER_TEMP/merged"
          while read -r sha; do
            gh api "repos/$GITHUB_REPOSITORY/commits/$sha/pulls" \
              --jq '.[] | select(.merged_at != null) | .number' >> "$RUNNER_TEMP/merged"
          done < "$RUNNER_TEMP/commits"
          python .github/scripts/release_version.py changes "$SINCE" "$RUNNER_TEMP/merged"

  test:
    name: Test
    needs: prepare
    permissions:
      contents: read
    uses: ./.github/workflows/tests.yml
    with:
      ref: ${{ needs.prepare.outputs.sha }}

  validate:
    name: Validate
    needs: prepare
    permissions:
      contents: read
    uses: ./.github/workflows/hacs-validate.yml
    with:
      ref: ${{ needs.prepare.outputs.sha }}

  publish:
    name: Tag and publish
    needs: [prepare, test, validate]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.prepare.outputs.version }}
      TAG: ${{ needs.prepare.outputs.tag }}
      SHA: ${{ needs.prepare.outputs.sha }}
      PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
      PREVIOUS_TAG: ${{ needs.prepare.outputs.previous_tag }}
      DRAFT_ID: ${{ needs.prepare.outputs.draft_id }}
      DRAFT_BODY: ${{ needs.prepare.outputs.draft_body }}
    steps:
      - name: Check out the tested commit
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.sha }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install packaging
        run: python -m pip install packaging==26.3

      - name: Build the zip, with the manifest's version set
        run: |
          python .github/scripts/release_version.py write "$VERSION" "$INTEGRATION/manifest.json"
          changed=$(git status --porcelain)
          if [[ "$changed" != " M $INTEGRATION/manifest.json" ]]; then
            echo "::error::Setting the version changed something else, or nothing:"
            echo "$changed"
            exit 1
          fi
          zip=$(jq -r .filename hacs.json)
          python .github/scripts/release_zip.py "$INTEGRATION" "$RUNNER_TEMP/$zip" "$VERSION"
          echo "ZIP=$RUNNER_TEMP/$zip" >> "$GITHUB_ENV"

      - name: Tag the tested commit
        run: |
          # A re-run finds the tag it pushed before; the tag is annotated, so compare its commit.
          if git fetch --quiet origin "refs/tags/$TAG:refs/tags/$TAG" 2>/dev/null; then
            tagged=$(git rev-parse "$TAG^{commit}")
            if [[ "$tagged" != "$SHA" ]]; then
              echo "::error::$TAG already tags $tagged, not the tested commit $SHA."
              exit 1
            fi
            echo "$TAG already tags $SHA."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "$TAG" -m "Release $TAG" "$SHA"
            git push origin "refs/tags/$TAG"
          fi

      - name: Publish the GitHub release with the zip
        run: |
          # releases/tags/... returns only a published release, never the draft of the same tag.
          if gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" --silent 2>/dev/null; then
            echo "$TAG is already released; uploading the zip again."
            gh release upload "$TAG" "$ZIP" --repo "$GITHUB_REPOSITORY" --clobber
            exit 0
          fi
          flags=()
          if [[ "$PRERELEASE" == "false" && -n "$DRAFT_ID" ]]; then
            # A final release carries the draft's notes, as approved before running this.
            base64 --decode <<< "$DRAFT_BODY" > "$RUNNER_TEMP/notes.md"
            flags+=(--notes-file "$RUNNER_TEMP/notes.md")
          else
            # GitHub writes the notes from the pull requests since the previous release.
            flags+=(--generate-notes)
            if [[ -n "$PREVIOUS_TAG" ]]; then
              flags+=(--notes-start-tag "$PREVIOUS_TAG")
            fi
          fi
          if [[ "$PRERELEASE" == "true" ]]; then
            flags+=(--prerelease --latest=false)
          fi
          gh release create "$TAG" "$ZIP" --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "$TAG" "${flags[@]}"

      # A release candidate keeps the draft: the final release that ends its series takes the
      # draft's notes, and test builds take their version from it.
      - name: Delete the draft the final release replaces
        if: needs.prepare.outputs.prerelease == 'false' && needs.prepare.outputs.draft_id != ''
        run: |
          if ! gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/$DRAFT_ID" --silent 2> "$RUNNER_TEMP/error"; then
            cat "$RUNNER_TEMP/error"
            # Deleted by an earlier attempt of this run.
            grep -q "HTTP 404" "$RUNNER_TEMP/error"
          fi
