name: Tests

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
  # The Release and Test build workflows run these on the exact commit they publish.
  workflow_call:
    inputs:
      ref:
        description: The commit to test.
        required: true
        type: string

permissions:
  contents: read

# The shell given explicitly, so GitHub runs every step with pipefail.
defaults:
  run:
    shell: bash

jobs:
  test:
    name: Run unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install beautifulsoup4 lxml packaging==26.3

      - name: Run tests
        run: python -m unittest discover -v -s ./custom_components/aula/aula_proxy -p "test_*.py"

      - name: Test the release scripts
        run: python -m unittest discover -v -s ./.github/scripts -p "test_*.py"
