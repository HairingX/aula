name: Release (manual version)

# Manual override: publishes the supplied version regardless of draft state.
# If a draft release exists, its body is still captured as the release notes
# and the draft is deleted (same behavior as the default release.yml). Use
# this only when you need to override the version that release-drafter would
# otherwise resolve (e.g. jumping minor without re-labelling PRs).

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g. 0.2.6 — without v prefix)'
        required: true

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Publish with supplied version
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository (so the local composite action is on disk)
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Publish release
        uses: ./.github/actions/release-publish
        with:
          version: ${{ inputs.version }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
